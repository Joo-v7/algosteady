spring.application.name=algosteady

server.port=8090

# DB(PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# OAuth 로그인
algosteady.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${algosteady.frontend-url}/login/oauth2/code/{registrationId}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=ALGOSTEADY_SESSION
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Docker
algosteady.runner.images.c=algosteady-runner-c:14.4.0
algosteady.runner.preparation-timeout=30s
algosteady.runner.test-timeout=2s
algosteady.runner.docker-timeout=10s
algosteady.runner.output-limit-bytes=1048576
algosteady.runner.cpus=1
algosteady.runner.memory=512m
algosteady.runner.pids-limit=128
